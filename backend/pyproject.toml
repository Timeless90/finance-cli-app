[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-cli-app-backend"
version = "0.4.0"
description = "CFO planning, forecasting, and quantitative risk platform"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "MIT"}
authors = [{name = "Timeless90"}]
dependencies = [
  "opentelemetry-sdk==1.40.0",
  "opentelemetry-exporter-otlp-proto-http==1.40.0",
  "opentelemetry-instrumentation-fastapi==0.61b0",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
  "python-pptx>=1.0,<2",
  "openai>=1.75,<3",
  "azure-identity>=1.20,<2",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "pyright>=1.1,<2",
  "pyyaml>=6,<7",
  "diff-cover>=9,<11",
]

[project.scripts]
finance-cli = "finance_cli.cli:app"
cfo-api = "app.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "finance_cli*"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
[tool.ruff.lint]
extend-select = ["I"]
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["app", "finance_cli", "tests"]
venvPath = "."
venv = ".venv"
[tool.coverage.run]
source = ["app", "finance_cli"]
branch = true
[tool.coverage.report]
show_missing = true

[tool.setuptools.package-data]
"app.shared" = ["project.json"]
