name: finance-cli-app
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template-local
      POSTGRES_DB: template
    ports:
      - "127.0.0.1:${APP_DB_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template -d template"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres-data:
