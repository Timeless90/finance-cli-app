name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_USER: template
          POSTGRES_PASSWORD: template-local
          POSTGRES_DB: template
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U template -d template"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - name: Require committed lockfiles and generated client
        run: test -f backend/uv.lock && test -f frontend/pnpm-lock.yaml && test -f frontend/src/generated/api.ts
      - name: Install
        run: make install
      - name: Browser system libraries
        run: cd frontend && pnpm exec playwright install --with-deps chromium
      - name: Quality and coverage
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: make check
      - name: Migrations
        run: make backend-migrate backend-migration-check
      - name: Frontend and Storybook builds
        run: make frontend-build && pnpm --dir frontend build:storybook
      - name: End-to-end and accessibility
        env:
          TEMPLATE_INFRA_MANAGED: "1"
        run: make e2e e2e-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            backend/coverage.xml
            frontend/coverage/
            frontend/playwright-report/
            frontend/test-results/
