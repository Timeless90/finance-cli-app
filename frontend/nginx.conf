# Local development gateway; published ports are loopback-only.
map $http_x_local_actor $local_user { default local-developer; reviewer local-reviewer; approver local-approver; }
map $http_x_local_actor $local_roles { default cfo; reviewer controller; approver cfo; }
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Local-Actor "";
        proxy_set_header X-User $local_user;
        proxy_set_header X-Roles $local_roles;
        proxy_set_header X-Companies "AURELIA,EUROPE";
    }
    location /health/ { proxy_pass http://backend:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
